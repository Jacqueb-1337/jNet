name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jNet-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.JNET_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JNET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jnet.p12"
          gradle :app:assembleRelease
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/jnet-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/jnet.p12" --ks-key-alias jnet --ks-pass env:KEYSTORE_PASSWORD --out "jNet-$version.apk" "$RUNNER_TEMP/jnet-aligned.apk"
          "$tools/apksigner" verify "jNet-$version.apk"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: jNet-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jNet-*.apk --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --prerelease
