plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'net.jnet.host'
    compileSdk 35
    defaultConfig {
        applicationId 'net.jnet.host'
        minSdk 33
        targetSdk 35
        versionCode 25
        versionName '0.1.24'
    }
}
android.compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

dependencies { implementation 'com.google.zxing:core:3.5.3' }

dependencies { implementation 'org.nanohttpd:nanohttpd:2.3.1' }

testImplementation 'junit:junit:4.13.2'
testImplementation 'org.yaml:snakeyaml:2.4'
